# Regras de alerta (1 alerta disparado exigido pela rubrica).
groups:
  - name: travessia
    rules:
      # Alerta 1 (CRÍTICO): o MVP está fora do ar (sonda passou a falhar).
      - alert: MVPDown
        expr: probe_success{instance="travessia-mvp"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MVP fora do ar"
          description: "O Travessia não respondeu por mais de 1 minuto."

      # Alerta 2 (WARNING): latência da sondagem aumentou (saturação).
      - alert: MVPHighLatency
        expr: probe_duration_seconds{instance="travessia-mvp"} > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Latência alta no MVP"
          description: "A resposta na sondagem demorou mais de 3s por 2 minutos."