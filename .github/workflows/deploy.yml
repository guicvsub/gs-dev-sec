name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  security:
    name: Segurança
    uses: ./.github/workflows/security.yml

  build:
    name: Build da imagem
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build da imagem do site
        run: docker build --pull -t travessia-web:latest .

      - name: Resumo do build
        if: always()
        run: |
          {
            echo "## Build da imagem - Travessia"
            echo ""
            echo "A imagem \`travessia-web:latest\` foi gerada e validada."
            echo ""
            echo "Para publicar no servidor (VPS AIS), suba a imagem ou use o"
            echo "\`docker compose\` diretamente na VPS — veja \`DEPLOY.md\`."
          } >> "$GITHUB_STEP_SUMMARY"