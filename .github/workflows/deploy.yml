name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_IN_AUTOMATION: "true"

jobs:
  security:
    name: Segurança
    uses: ./.github/workflows/security.yml

  infrastructure:
    name: Terraform (infra)
    needs: security
    runs-on: ubuntu-latest
    outputs:
      instance_id: ${{ steps.outputs.outputs.instance_id }}
      public_ip: ${{ steps.outputs.outputs.public_ip }}
      public_url: ${{ steps.outputs.outputs.public_url }}
      ecr_repository_url: ${{ steps.outputs.outputs.ecr_repository_url }}
      dashboard_url: ${{ steps.outputs.outputs.dashboard_url }}
      log_group_name: ${{ steps.outputs.outputs.log_group_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Garantir o bucket de state no S3
        id: state
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="${{ vars.TF_STATE_BUCKET }}"
          if [ -z "$BUCKET" ]; then
            BUCKET="travessia-tfstate-$ACCOUNT_ID"
          fi

          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Criando o bucket $BUCKET"
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
          fi

          aws s3api put-bucket-versioning \
            --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration \
            "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -input=false -no-color \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="key=travessia/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false -no-color

      - name: Salvar outputs
        id: outputs
        working-directory: terraform
        run: |
          {
            echo "instance_id=$(terraform output -raw instance_id)"
            echo "public_ip=$(terraform output -raw public_ip)"
            echo "public_url=$(terraform output -raw public_url)"
            echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)"
            echo "dashboard_url=$(terraform output -raw dashboard_url)"
            echo "log_group_name=$(terraform output -raw log_group_name)"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Build e deploy
    needs: infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build e push da imagem para o ECR
        env:
          ECR_REPOSITORY: ${{ needs.infrastructure.outputs.ecr_repository_url }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${ECR_REPOSITORY%%/*}"

          # Tag única por execução: o ECR é imutável e o re-run não sobrescreve imagens.
          IMAGE_URI="$ECR_REPOSITORY:${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          docker build --pull -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Aguardar o SSM Agent
        env:
          INSTANCE_ID: ${{ needs.infrastructure.outputs.instance_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            STATUS="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)"
            echo "tentativa $i/30: ${STATUS:-sem resposta}"
            if [ "$STATUS" = "Online" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::O SSM Agent nao ficou online em 5 minutos."
          exit 1

      - name: Deploy na instância via SSM
        env:
          INSTANCE_ID: ${{ needs.infrastructure.outputs.instance_id }}
          LOG_GROUP: ${{ needs.infrastructure.outputs.log_group_name }}
        run: |
          set -euo pipefail
          B64="$(base64 -w0 scripts/deploy-remote.sh)"
          # O AWS-RunShellScript usa /bin/sh (dash no Ubuntu): sem pipefail aqui.
          REMOTE_CMD="set -e; echo '$B64' | base64 -d > /tmp/deploy-remote.sh; chmod +x /tmp/deploy-remote.sh; /tmp/deploy-remote.sh '$IMAGE_URI' '$AWS_REGION' '$LOG_GROUP'"

          jq -n \
            --arg instance "$INSTANCE_ID" \
            --arg command "$REMOTE_CMD" \
            --arg comment "Deploy Travessia ${GITHUB_SHA::7}" \
            '{InstanceIds: [$instance], DocumentName: "AWS-RunShellScript", Comment: $comment, Parameters: {commands: [$command]}}' \
            > /tmp/ssm-send.json

          COMMAND_ID="$(aws ssm send-command \
            --cli-input-json file:///tmp/ssm-send.json \
            --query 'Command.CommandId' \
            --output text)"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "Comando SSM enviado: $COMMAND_ID"

      - name: Verificar o resultado do deploy
        env:
          INSTANCE_ID: ${{ needs.infrastructure.outputs.instance_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            echo "tentativa $i/60: $STATUS"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::Deploy falhou com status $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timeout aguardando o deploy."
          exit 1

      - name: Verificar a URL pública
        env:
          PUBLIC_URL: ${{ needs.infrastructure.outputs.public_url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$PUBLIC_URL" || true)"
            echo "tentativa $i/30: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "MVP no ar: $PUBLIC_URL"
              exit 0
            fi
            sleep 5
          done
          echo "::error::A URL publica nao respondeu 200."
          exit 1

      - name: Resumo do deploy
        if: always()
        run: |
          {
            echo "## Deploy Blindado - Travessia"
            echo ""
            echo "| Item | Link |"
            echo "|---|---|"
            echo "| MVP | ${{ needs.infrastructure.outputs.public_url }} |"
            echo "| Dashboard | ${{ needs.infrastructure.outputs.dashboard_url }} |"
            echo "| Imagem | \`${IMAGE_URI:-n/a}\` |"
            echo "| Logs | \`${{ needs.infrastructure.outputs.log_group_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
