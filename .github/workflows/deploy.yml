name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Endereço da VPS AIS onde o MVP roda (via Terraform/OpenStack ou já existente).
  VPS_HOST: ${{ vars.VPS_HOST || '4.168.236.152' }}

jobs:
  security:
    name: Segurança
    uses: ./.github/workflows/security.yml

  build:
    name: Build da imagem
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build da imagem do site
        run: docker build --pull -t travessia-web:recipe .

  deploy:
    name: Deploy automático (SSH p/ VPS)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy na VPS via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script: |
            set -e
            cd ${{ vars.VPS_PATH || '$HOME/gs-dev-sec' }}
            git pull
            docker compose up -d --build web
            docker compose ps web

      - name: Verificar a URL pública
        env:
          PUBLIC_URL: "http://${{ env.VPS_HOST }}/"
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$PUBLIC_URL" || true)"
            echo "tentativa $i/20: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "MVP no ar: $PUBLIC_URL"
              exit 0
            fi
            sleep 5
          done
          echo "::error::A URL publica nao respondeu 200."
          exit 1

      - name: Resumo do deploy
        if: always()
        run: |
          {
            echo "## Deploy - Travessia"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| MVP | http://${{ env.VPS_HOST }}/ |"
            echo "| Métricas | http://<localhost>:3000 (Grafana) |"
            echo "| Deploy | ssh → VPS (\${{ env.VPS_HOST }}) → docker compose up |"
          } >> "$GITHUB_STEP_SUMMARY"