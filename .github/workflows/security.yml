name: Security

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks (segredos)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Procurar segredos no histórico
        run: |
          # Imagem fixada por digest (Gitleaks 8.28.0), a mesma usada nos testes locais.
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source /repo \
              --config /repo/.gitleaks.toml \
              --verbose --redact --exit-code 1

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Analisar o código
        run: |
          # Imagem fixada por digest para evitar que uma tag móvel mude o scanner.
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            semgrep/semgrep@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d \
            semgrep scan \
              --config p/default \
              --config p/secrets \
              --error \
              --sarif --output semgrep.sarif

      - name: Publicar relatório SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  trivy:
    name: Trivy (vulnerabilidades de imagem)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Construir a imagem para o scan
        run: docker build --pull -t travessia-web:scan .

      - name: Escanear a imagem com Trivy (via Docker)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/repo" \
            aquasec/trivy:0.55.2 image \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1 \
              --format sarif \
              --output /repo/trivy-results.sarif \
              travessia-web:scan

      - name: Publicar relatório SARIF do Trivy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: ignore
