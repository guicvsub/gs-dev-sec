name: Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "destroy" para confirmar a exclusão de toda a infraestrutura.'
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"

jobs:
  destroy:
    name: Terraform destroy
    if: github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Descobrir o bucket de state
        id: state
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="${{ vars.TF_STATE_BUCKET }}"
          if [ -z "$BUCKET" ]; then
            BUCKET="travessia-tfstate-$ACCOUNT_ID"
          fi
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "::error::Bucket de state $BUCKET nao encontrado. Nada para destruir."
            exit 1
          fi
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -input=false -no-color \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="key=travessia/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform destroy
        working-directory: terraform
        run: terraform destroy -auto-approve -input=false -no-color

      - name: Resumo
        run: |
          {
            echo "## Infraestrutura destruída"
            echo ""
            echo "O bucket de state (\`${{ steps.state.outputs.bucket }}\`) foi mantido."
          } >> "$GITHUB_STEP_SUMMARY"
