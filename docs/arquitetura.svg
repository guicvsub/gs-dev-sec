<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do deploy do Travessia</title>
  <desc id="desc">Pipeline GitHub Actions com Gitleaks, Semgrep e Trivy; IaC com Terraform/OpenStack; build da imagem Docker; deploy automático via SSH na VPS AIS; observabilidade com Prometheus e Grafana.</desc>

  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>

  <text x="60" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Travessia — Arquitetura do Deploy</text>
  <text x="60" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">IaC (Terraform/OpenStack) + GitHub Actions + Docker + Prometheus/Grafana</text>

  <!-- ============ GitHub ============ -->
  <rect x="60" y="140" width="340" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="80" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0c4a6e">Desenvolvedor</text>
  <text x="80" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#075985">git push na branch main</text>

  <line x1="230" y1="220" x2="230" y2="252" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow-dark)"/>

  <rect x="60" y="260" width="340" height="90" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="80" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">GitHub — repositório público</text>
  <text x="80" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">Dockerfile • Terraform • workflows • docs</text>

  <line x1="230" y1="350" x2="230" y2="382" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow-dark)"/>

  <rect x="60" y="390" width="340" height="330" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="80" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#155e75">GitHub Actions — pipeline</text>

  <rect x="85" y="445" width="290" height="58" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="100" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">1. Gitleaks</text>
  <text x="100" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">segredos no histórico do Git</text>

  <rect x="85" y="518" width="290" height="58" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="100" y="543" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">2. Semgrep (SAST)</text>
  <text x="100" y="563" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">código, Docker, Actions — SARIF</text>

  <rect x="85" y="591" width="290" height="58" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="100" y="616" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">3. Trivy</text>
  <text x="100" y="636" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">vulnerabilidades CRITICAL/HIGH</text>

  <text x="80" y="685" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">qualquer falha bloqueia o deploy</text>

  <line x1="400" y1="550" x2="462" y2="550" stroke="#0891b2" stroke-width="4" marker-end="url(#arrow-dark)"/>

  <!-- ============ VPS ============ -->
  <rect x="470" y="140" width="700" height="620" rx="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <text x="500" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">VPS AIS — Ubuntu 24.04 (IaC: Terraform/OpenStack)</text>
  <text x="500" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Docker + Docker Compose • floating IP • security group (só 80 pública; SSH restrito)</text>

  <rect x="500" y="230" width="320" height="500" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">Container web</text>
  <text x="520" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#166534">deploy automático via SSH</text>

  <rect x="520" y="300" width="280" height="300" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="540" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">Nginx unprivileged</text>
  <text x="540" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1e40af">serve os estáticos do React</text>
  <text x="540" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1e40af">porta 8080 interna → 80 pública</text>
  <text x="540" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1e40af">roda como UID 101 (não-root)</text>
  <text x="540" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1e40af">/stub_status para métricas</text>
  <text x="540" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">container: travessia-web • restart: unless-stopped</text>

  <rect x="500" y="640" width="320" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="520" y="669" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#7f1d1d">porta 80 pública (única aberta)</text>
  <text x="520" y="692" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#991b1b">deploy: git pull + docker compose up -d --build web</text>

  <!-- Observabilidade local -->
  <rect x="850" y="230" width="290" height="200" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="870" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412">Observabilidade (local)</text>
  <text x="870" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9a3412">Prometheus + Grafana</text>
  <text x="870" y="317" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9a3412">4 métricas de ouro</text>
  <text x="870" y="339" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9a3412">alertas: MVPDown / MVPHighLatency</text>
  <text x="870" y="361" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">aponta para http://IP_MVP /stub_status + sonda</text>

  <!-- usuário -->
  <rect x="60" y="780" width="300" height="60" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="807" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Cidadão — navegador</text>
  <text x="80" y="828" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1e40af">HTTP :80 → floating IP da VPS</text>

  <path d="M 210 780 L 210 690 L 500 690" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="360" y="740" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">HTTP 80</text>

  <!-- rodapé -->
  <text x="530" y="790" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">O deploy só acontece depois de Gitleaks, Semgrep e Trivy passarem (deploy automático via SSH).</text>
  <text x="530" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">IaC: state e .tfvars fora do repo; porta admin/SSH nunca 0.0.0.0/0.</text>
  <text x="530" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Custo fixo da VPS (plano AIS) + Prometheus/Grafana locais.</text>
</svg>