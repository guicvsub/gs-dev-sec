<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do Deploy Blindado do Travessia</title>
  <desc id="desc">Pipeline GitHub Actions com Gitleaks, Semgrep, Terraform, build no ECR e deploy via SSM em uma instância EC2 na AWS, com observabilidade no CloudWatch e alertas por SNS.</desc>

  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1600" height="1060" fill="#f8fafc"/>

  <text x="60" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Travessia — Arquitetura do Deploy Blindado</text>
  <text x="60" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">GitHub Actions + Terraform + AWS: build, segurança, deploy automático e observabilidade</text>

  <!-- legenda -->
  <line x1="1210" y1="62" x2="1260" y2="62" stroke="#0f172a" stroke-width="3"/>
  <text x="1270" y="67" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">tráfego / runtime</text>
  <line x1="1210" y1="92" x2="1260" y2="92" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="1270" y="97" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">CI/CD / state</text>

  <!-- ============ GitHub ============ -->
  <rect x="60" y="140" width="340" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="80" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0c4a6e">Desenvolvedor</text>
  <text x="80" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#075985">git push na branch main</text>

  <line x1="230" y1="220" x2="230" y2="252" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow-dark)"/>

  <rect x="60" y="260" width="340" height="90" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="80" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">GitHub — repositório público</text>
  <text x="80" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">Dockerfile • Terraform • workflows • docs</text>

  <line x1="230" y1="350" x2="230" y2="382" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow-dark)"/>

  <rect x="60" y="390" width="340" height="470" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="80" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#155e75">GitHub Actions — pipeline</text>

  <rect x="85" y="445" width="290" height="58" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="100" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">1. Gitleaks</text>
  <text x="100" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">segredos no histórico do Git</text>

  <rect x="85" y="518" width="290" height="58" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="100" y="543" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">2. Semgrep</text>
  <text x="100" y="563" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">SAST: código, IaC, Docker, Actions</text>

  <rect x="85" y="591" width="290" height="58" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="100" y="616" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">3. Terraform</text>
  <text x="100" y="636" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">fmt • validate • apply (state no S3)</text>

  <rect x="85" y="664" width="290" height="58" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="100" y="689" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">4. Build + push</text>
  <text x="100" y="709" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Docker → Amazon ECR (tag imutável)</text>

  <rect x="85" y="737" width="290" height="58" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="100" y="762" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">5. Deploy</text>
  <text x="100" y="782" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">SSM → docker pull + run + healthcheck</text>

  <text x="80" y="832" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">qualquer falha bloqueia o deploy</text>

  <line x1="400" y1="620" x2="492" y2="620" stroke="#0891b2" stroke-width="4" marker-end="url(#arrow-cyan)"/>
  <text x="410" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#155e75">CI/CD</text>

  <!-- ============ AWS ============ -->
  <rect x="500" y="140" width="1040" height="800" rx="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <text x="530" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">AWS — us-east-1</text>
  <text x="530" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">infraestrutura 100% declarada em Terraform</text>

  <!-- VPC -->
  <rect x="530" y="230" width="560" height="410" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">VPC 10.20.0.0/16</text>
  <text x="550" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#166534">subnet pública 10.20.1.0/24 • Internet Gateway</text>

  <rect x="550" y="298" width="520" height="322" rx="10" fill="#f7fee7" stroke="#65a30d" stroke-width="1.5" stroke-dasharray="7 5"/>

  <rect x="575" y="315" width="470" height="180" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="595" y="347" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">EC2 t3.micro — Ubuntu 24.04</text>
  <text x="595" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1e40af">Docker + Nginx não-root (porta 8080)</text>
  <text x="595" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1e40af">Elastic IP (IPv4 público)</text>
  <text x="595" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1e40af">IMDSv2 obrigatório • EBS gp3 criptografado</text>
  <text x="595" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1e40af">SSM Agent — acesso sem porta 22</text>
  <text x="595" y="475" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">container: travessia-web • restart: unless-stopped</text>

  <rect x="575" y="512" width="470" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="595" y="541" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#7f1d1d">Security Group</text>
  <text x="595" y="565" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#991b1b">entrada: 80/tcp (0.0.0.0/0) • SSH desabilitado</text>
  <text x="595" y="583" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#991b1b">saída: liberada para ECR, SSM e CloudWatch</text>

  <!-- IAM -->
  <rect x="550" y="655" width="520" height="115" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="570" y="684" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#4c1d95">IAM Role da instância (instance profile)</text>
  <text x="570" y="710" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5b21b6">AmazonSSMManagedInstanceCore • ECR read only</text>
  <text x="570" y="732" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5b21b6">CloudWatch Logs (create stream + put events)</text>
  <text x="570" y="754" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6d28d9">sem chaves de acesso gravadas na instância</text>

  <!-- ECR -->
  <rect x="1130" y="230" width="380" height="120" rx="12" fill="#ecfdf5" stroke="#0d9488" stroke-width="2"/>
  <text x="1150" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#115e59">Amazon ECR — travessia-web</text>
  <text x="1150" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f766e">imagens imutáveis • scan on push</text>
  <text x="1150" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f766e">tag: commit SHA + tentativa do run</text>
  <text x="1150" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">lifecycle: mantém as 15 mais recentes</text>

  <!-- CloudWatch -->
  <rect x="1130" y="380" width="380" height="190" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1150" y="415" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#9a3412">Amazon CloudWatch</text>
  <text x="1150" y="443" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9a3412">logs JSON do Nginx → grupo travessia-web</text>
  <text x="1150" y="467" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9a3412">metric filter: Http5xx (status ≥ 500)</text>
  <text x="1150" y="491" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9a3412">dashboard: travessia-mvp</text>
  <text x="1150" y="515" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9a3412">alarmes: 5xx, CPU &gt; 80%, status check</text>
  <text x="1150" y="539" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9a3412">Logs Insights para investigar erros</text>
  <text x="1150" y="559" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">retenção: 14 dias</text>

  <!-- SNS + email -->
  <rect x="1130" y="600" width="380" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1150" y="632" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#7f1d1d">Amazon SNS — travessia-alerts</text>
  <text x="1150" y="658" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#991b1b">tópico dos alarmes • assinatura de e-mail</text>
  <text x="1150" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">confirme o e-mail após o primeiro apply</text>

  <rect x="1130" y="720" width="380" height="70" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="1150" y="749" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">E-mail do responsável</text>
  <text x="1150" y="772" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">recebe ALARM e OK do CloudWatch</text>

  <!-- S3 -->
  <rect x="1130" y="820" width="380" height="90" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="1150" y="852" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#713f12">Amazon S3 — state do Terraform</text>
  <text x="1150" y="878" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#854d0e">versionado • criptografado • acesso público bloqueado</text>
  <text x="1150" y="898" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">lock nativo do S3 (Terraform ≥ 1.10)</text>

  <!-- setas AWS internas -->
  <path d="M 1130 290 L 1085 290 L 1085 380 L 1048 380" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <text x="1090" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f766e">docker pull</text>

  <line x1="1045" y1="430" x2="1122" y2="430" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="1048" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9a3412">logs JSON</text>

  <line x1="1320" y1="570" x2="1320" y2="592" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <text x="1330" y="589" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#991b1b">alarmes</text>

  <line x1="1320" y1="690" x2="1320" y2="712" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <text x="1330" y="709" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#991b1b">e-mail</text>

  <!-- state do Terraform -->
  <line x1="400" y1="870" x2="1122" y2="870" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-dark)"/>
  <text x="700" y="860" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Terraform state (S3 remoto)</text>

  <!-- usuário -->
  <rect x="60" y="970" width="300" height="60" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="997" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Cidadão — navegador</text>
  <text x="80" y="1018" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1e40af">HTTP :80 → Elastic IP</text>

  <path d="M 210 970 L 210 940 L 480 940 L 480 450 L 567 450" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="486" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" transform="rotate(-90 486 700)">HTTP 80</text>

  <!-- rodapé -->
  <text x="530" y="1000" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Sem SSH: administração via SSM Session Manager. Deploy só acontece depois de Gitleaks e Semgrep passarem.</text>
  <text x="530" y="1024" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Custo estimado: ≈ US$ 13/mês em us-east-1 on-demand (EC2 + EBS + IPv4 público + serviços gerenciados).</text>
</svg>
